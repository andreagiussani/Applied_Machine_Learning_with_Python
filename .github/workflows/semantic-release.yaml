name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Publish an already tagged project version (for example, 1.1.0)"
        required: false
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare-release:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_version == '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Verify the existing PyPI release has a Git tag
        run: git show-ref --verify --quiet refs/tags/v1.0.2

      - name: Skip if a release pull request is already open
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_release_prs="$(gh pr list --base main --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("release/"))] | length')"
          if [[ "$open_release_prs" -gt 0 ]]; then
            echo "A release pull request is already open."
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate version and build release commit
        id: prepare
        if: steps.existing-pr.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_version="$(uv version --short)"
          # Let semantic-release calculate and stage the version changes without
          # asking it for a permanent GitHub Actions release output (which
          # requires a release commit SHA). Commit those files below so the
          # generated release branch still contains a normal release commit.
          uvx --from "python-semantic-release==10.5.3" semantic-release version --no-commit --no-push --no-tag --no-vcs-release
          version="$(uv version --short)"
          if [[ "$version" == "$base_version" ]]; then
            echo "No release-worthy commits found."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          else
            git add pyproject.toml uv.lock
            if [[ -f CHANGELOG.md ]]; then
              git add CHANGELOG.md
            fi
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(release): $version"
            short_sha="$(git rev-parse --short HEAD)"
            release_branch="release/${version}/${short_sha}"
            git push origin "HEAD:refs/heads/$release_branch"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open release pull request
        if: steps.prepare.outputs.has_release == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_BRANCH#release/}"
          version="${version%%/*}"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): $version" \
            --body "Automated semantic release for version $version. Review the generated changelog and package version, then merge to publish to PyPI."

      - name: Run CI on the release branch
        if: steps.prepare.outputs.has_release == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.release_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yaml --ref "$RELEASE_BRANCH"

  publish-release:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_version != '') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/egeaml
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.publish_version) || github.event.pull_request.merge_commit_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Verify release version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          REQUESTED_VERSION: ${{ inputs.publish_version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            release_version="$REQUESTED_VERSION"
          else
            release_version="${RELEASE_BRANCH#release/}"
            release_version="${release_version%%/*}"
          fi
          project_version="$(uv version --short)"
          if [[ "$release_version" != "$project_version" ]]; then
            echo "Requested release version $release_version does not match project version $project_version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build --no-sources

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(uv version --short)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "GitHub Release v$version already exists; reusing it."
          else
            target_sha="$(git rev-parse HEAD)"
            gh release create "v$version" dist/* \
              --target "$target_sha" \
              --title "v$version" \
              --generate-notes
          fi

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
